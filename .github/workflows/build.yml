# Build-Prüfung: baut bei jedem Push (außer Tags) und Pull Request eine Debug-APK
# und führt die Unit-Tests aus. Die gebaute APK wird als Artefakt angehängt.

name: Build

on:
  push:
    branches: ['**']
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Quelloffener Cache (der Standard-Anbieter ist seit v6 proprietär)
          cache-provider: basic

      - name: Debug-APK bauen und Unit-Tests ausführen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
