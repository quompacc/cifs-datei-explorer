[versions]
paparazzi = "2.0.0-alpha05.1" # 1.x does not support AGP 9
aboutlibraries = "15.3.0"
androidnetworktools = "0.4.5.3"
androidxJunit = "1.3.0"
apacheCommonsNet = "3.13.0"
apacheCommonsVfs = "2.10.0"
appcompat = "1.8.0"
androidxComposeBom = "2026.09.00"
coreKtx = "1.19.1"
datastorePreferences = "1.3.0"
dcerpc = "0.12.13"
documentfile = "1.1.0"
gradle = "9.4.0"
guava = "33.7.2-android"
hiltAndroid = "2.60.1"
androidxHilt = "1.4.0"
jcifsNg = "2.1.10"
jsch = "2.28.8"
junit = "4.13.2"
kotlin = "2.4.21"
kotlinxCoroutinesAndroid = "1.11.0"
kotlinxSerializationJson = "1.12.0"
ksp = "2.3.12"
lifecycle = "2.11.0"
