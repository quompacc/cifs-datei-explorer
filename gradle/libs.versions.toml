androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }
apache-commons-net = { module = "commons-net:commons-net", version.ref = "apacheCommonsNet" }
apache-commons-vfs = { module = "org.apache.commons:commons-vfs2-jackrabbit2", version.ref = "apacheCommonsVfs" }
dcerpc = { module = "com.rapid7.client:dcerpc", version.ref = "dcerpc" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
